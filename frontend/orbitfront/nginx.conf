server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le navigateur n'appelle jamais le back directement : Nginx relaie /api
    location /api/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $http_host;   # garde le port : évite un faux "CORS" côté Spring
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router : toute autre URL renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}

# Port réservé aux Agents ORBIT : Nginx relaie leur WebSocket vers le back (dans les deux sens)
server {
    listen 8444;

    location /api/v1/agents/ws {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;                       # obligatoire pour un WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;                     # sinon Nginx coupe une connexion silencieuse après 60 s
    }
}
